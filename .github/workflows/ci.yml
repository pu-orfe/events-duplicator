name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up docker-compose wrapper
        run: |
          if ! command -v docker-compose &> /dev/null; then
            echo "Creating docker-compose wrapper..."
            echo '#!/bin/sh' | sudo tee /usr/local/bin/docker-compose > /dev/null
            echo 'exec docker compose "$@"' | sudo tee -a /usr/local/bin/docker-compose > /dev/null
            sudo chmod +x /usr/local/bin/docker-compose
          fi

      - name: Run tests inside Docker
        run: |
          docker-compose up --build --abort-on-container-exit
